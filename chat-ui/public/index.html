<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ShopWala customer-support system.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      margin: 5vh auto;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    .header {
      padding: 18px 24px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: white;
      color: #111827;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 12px;
      opacity: 0.7;
    }

    .status {
      font-size: 12px;
      color: #86efac;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .bot {
      align-self: flex-start;
      background: #eef2f7;
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: #111827;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .typing {
      font-size: 13px;
      color: #6b7280;
      padding: 0 4px;
    }

    .composer {
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .name-row {
      margin-bottom: 10px;
    }

    .name-row input,
    .message-row textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font: inherit;
    }

    .message-row {
      display: flex;
      gap: 10px;
    }

    .message-row textarea {
      min-height: 52px;
      max-height: 140px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      background: #111827;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .suggestions button {
      padding: 8px 12px;
      background: #eef2f7;
      color: #111827;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .app {
        height: 100vh;
        margin: 0;
        border-radius: 0;
      }

      .chat {
        padding: 18px;
      }

      .message {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">S</div>
        <div>
          <h1>ShopWala customer-support system.</h1>
          <p>AI-powered customer assistance</p>
        </div>
      </div>

      <div class="status">● Online</div>
    </header>

    <main class="chat" id="chat">

      <div class="message bot">
        Hi! 👋 I'm AI customer-support system. 
        I can help with orders, returns, refunds, shipping and more.
      </div>

      <div class="suggestions">
        <button onclick="useSuggestion('Where is my order ORD-10245?')">
          Check my order
        </button>

        <button onclick="useSuggestion('What is the return policy?')">
          Return policy
        </button>

        <button onclick="useSuggestion('How long does a refund take?')">
          Refund timing
        </button>
      </div>

    </main>

    <section class="composer">

      <div class="name-row">
        <input
          id="customerName"
          type="text"
          placeholder="Your name"
          value="Paritosh"
        />
      </div>

      <div class="message-row">

        <textarea
          id="message"
          placeholder="Type your question..."
        ></textarea>

        <button id="sendButton">
          Send
        </button>

      </div>

    </section>

  </div>

  <script>
    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const nameInput = document.getElementById("customerName");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const div = document.createElement("div");

      div.className = `message ${type}`;
      div.textContent = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function useSuggestion(text) {
      messageInput.value = text;
      messageInput.focus();
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      const customerName = nameInput.value.trim() || "Guest";

      if (!message) return;

      addMessage(message, "user");

      messageInput.value = "";
      sendButton.disabled = true;

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "AI is thinking...";
      chat.appendChild(typing);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            customerName,
            message
          })
        });

        const data = await response.json();

        typing.remove();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        const answer =
          data.output ||
          data.message ||
          data.response ||
          "I couldn't generate a response.";

        addMessage(answer, "bot");

      } catch (error) {
        typing.remove();

        addMessage(
          "Sorry, I couldn't connect to the support system. Please try again.",
          "bot"
        );

        console.error(error);

      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
