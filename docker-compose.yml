services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-support-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./knowledge:/files/knowledge:ro
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=Asia/Kolkata
      - N8N_RESTRICT_FILE_ACCESS_TO=/files/knowledge
    restart: unless-stopped

volumes:
  n8n_data: